<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Tracking - Nova</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Leaflet.js CSS & JS for OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <nav>
    <div class="logo">Nova Live Dispatch</div>
  </nav>

  <div class="container">
    <h1 style="color:#22c55e;">Emergency Confirmed!</h1>
    
    {% if pro %}
      <div class="card" style="margin-bottom:1.5rem;">
        <h3>Professional Assigned: {{ pro.name }}</h3>
        <p><strong>Trade:</strong> {{ pro.trade }}</p>
        <p><strong>Phone:</strong> <a href="tel:{{ pro.phone }}" style="color:var(--accent);">{{ pro.phone }}</a></p>
        <p style="color:#22c55e;">Status: Professional pinged and en route!</p>
      </div>

      <!-- Interactive Map -->
      <div id="map" style="height: 400px; border-radius: 12px; margin-top: 1rem;"></div>

      <script>
        var clientLat = {{ client_req.lat or 48.8566 }};
        var clientLon = {{ client_req.lon or 2.3522 }};
        var proLat = {{ pro.lat or 48.8584 }};
        var proLon = {{ pro.lon or 2.2945 }};

        var map = L.map('map').setView([clientLat, clientLon], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(map);

        // Client Pin
        L.marker([clientLat, clientLon]).addTo(map)
          .bindPopup('<b>Your Location</b>').openPopup();

        // Pro Pin
        L.marker([proLat, proLon]).addTo(map)
          .bindPopup('<b>Professional: {{ pro.name }}</b>');
      </script>
    {% else %}
      <p>Waiting for professional assignment...</p>
    {% endif %}
  </div>
</body>
</html>
