<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Portal - Nova</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <div class="logo">Nova Pro</div>
    <div>
      <a href="/">Home</a>
      <a href="/client">Need a Pro</a>
      <a href="/professional">For Professionals</a>
    </div>
  </nav>

  <div class="container">
    <h1>Professional Directory</h1>
    
    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:2rem; margin-top:2rem;">
      
      <!-- Registration Form -->
      <form method="POST" style="background:var(--card-bg); padding:2rem; border-radius:12px; text-align:left;">
        <h3 style="margin-top:0;">Create Pro Profile</h3>
        
        <div style="margin-bottom:1rem;">
          <label style="display:block; margin-bottom:0.5rem;">Name</label>
          <input type="text" name="name" placeholder="Your full name" required style="width:100%; padding:0.75rem; border-radius:6px; border:none;">
        </div>

        <div style="margin-bottom:1rem;">
          <label style="display:block; margin-bottom:0.5rem;">Trade</label>
          <select name="trade" required style="width:100%; padding:0.75rem; border-radius:6px; border:none;">
            <option value="" disabled selected>Select trade</option>
            <option value="Electrician">Electrician</option>
            <option value="Plumber">Plumber</option>
            <option value="Locksmith">Locksmith</option>
            <option value="HVAC / Heating">HVAC / Heating</option>
          </select>
        </div>

        <div style="margin-bottom:1.5rem;">
          <label style="display:block; margin-bottom:0.5rem;">Address</label>
          <input type="text" name="address" placeholder="City or street address" required style="width:100%; padding:0.75rem; border-radius:6px; border:none;">
        </div>

        <button type="submit" class="btn" style="width:100%; border:none; cursor:pointer; background:#a855f7; color:#fff;">Register Profile</button>
      </form>

      <!-- Registered Profiles List with Delete Button -->
      <div style="text-align:left;">
        <h3 style="margin-top:0;">Registered Professionals</h3>
        {% if pros %}
          {% for p in pros %}
            <div class="card" style="margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center;">
              <div>
                <h3 style="margin:0 0 0.5rem 0; color:var(--accent);">{{ p.name }}</h3>
                <p style="margin:0 0 0.25rem 0;"><strong>Trade:</strong> {{ p.trade }}</p>
                <p style="margin:0; color:var(--text-muted);"><strong>Address:</strong> {{ p.address }}</p>
              </div>
              <form action="/delete_pro/{{ p.id }}" method="POST" onsubmit="return confirm('Delete this profile?');">
                <button type="submit" class="btn" style="background:#ef4444; color:#fff; border:none; cursor:pointer; padding:0.5rem 1rem;">Delete</button>
              </form>
            </div>
          {% endfor %}
        {% else %}
          <p style="color:var(--text-muted);">No profiles registered yet.</p>
        {% endif %}
      </div>

    </div>
  </div>
</body>
</html>
